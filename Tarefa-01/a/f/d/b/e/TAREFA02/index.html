<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>status do sistema</title>
     <link rel="stylesheet" href="style.css">
</head>
<style>
   
   * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
       }

       body{
            display: block;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
        } 
        
        .codigo{
            display: flex;
            gap: 20px;
        }

        .codigo span{
            font-size: clamp(45px, 80px, 80px);
            filter: blur(20px);
            transition: 0.3s;
        }

        .codigo span:hover,
        .codigo span:active{
            filter: blur(00);
            transform: scale(1.08);
        }
</style>
       
<body>

     <div class = "codigo">
        <span>A</span>
        <span>N</span>
        <span>A</span>
        <span>ﾠ</span> 
        <span>C</span>
        <span>L</span>
        <span>A</span>
        <span>R</span>
        <span>A</span>

    </div>

</body>
</html>
